# SQL Server
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
google.oauth.client-id=${GOOGLE_CLIENT_ID}

# MVP simulated payment is enabled by default for the project demo.
# Set PAYMENT_SIMULATION_ENABLED=false when a real payment integration is deployed.
app.payment.simulation-enabled=${PAYMENT_SIMULATION_ENABLED:true}

# JPA
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=validate

# Debug SQL
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.config.import=optional:classpath:application-local.properties


# email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Password reset emails are account-security messages and do not use notification preferences.
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}
app.mail.from=${EMAIL_FROM:service.dinogo@gmail.com}
app.password-reset.secret=${PASSWORD_RESET_SECRET}
app.password-reset.expiration-ms=${PASSWORD_RESET_EXPIRATION_MS:900000}
app.password-reset.rate-limit-window-ms=${PASSWORD_RESET_RATE_LIMIT_WINDOW_MS:60000}
app.password-reset.rate-limit-max-keys=${PASSWORD_RESET_RATE_LIMIT_MAX_KEYS:10000}
